<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF 8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color:#ece0d1;
            color: #38220f;
        }
    </style>
</head>
<body>
    <h1>The Coffee Gap</h1>

    <h2>Comparing the World's Coffee Harvest with Expert Ratings</h2>
     <div id="chart1" class="chart"></div>

     <div id="chart2" class="chart"></div>

     <div id="chart3" class="chart"></div>

     <div id="chart4" class="chart"></div>

     <div id="chart5" class="chart"></div>

     <div id="chart6" class="chart"></div>

     <div id="chart7" class="chart"></div>

     <div id="chart8" class="chart center"></div>

        <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
        <script>
            vegaEmbed("#chart1", "Visualization/Choropleth.vg.JSON", { actions: false });
            vegaEmbed("#chart2", "Visualization/Barchart.vg.JSON", { actions: false });
            vegaEmbed("#chart3", "Visualization/Linechart.vg.JSON", { actions: false });
            vegaEmbed("#chart4", "Visualization/Histogram.vg.JSON", { actions: false });
            vegaEmbed("#chart5", "Visualization/Heatmap.vg.JSON", { actions: false });
            vegaEmbed("#chart6", "Visualization/Boxplot.vg.JSON", { actions: false });
            vegaEmbed("#chart7", "Visualization/Dumbbell.vg.JSON", { actions: false });
            vegaEmbed("#chart8", "Visualization/Bubbleplot.vg.JSON", { actions: false });
        </script>
</body>
</html>
